<body>
<div class="wrap">
  <div id="app-root"></div>
</div>
<script>
  // Tải thư viện đọc Excel (SheetJS) — thử lần lượt vài CDN khác nhau, phòng
  // trường hợp mạng/trình duyệt chặn 1 CDN cụ thể (hay gặp với mạng công ty,
  // VPN, hoặc trình chặn quảng cáo).
  function loadScriptOnce(src){
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = () => resolve(true);
      s.onerror = () => reject(new Error('load failed: ' + src));
      document.head.appendChild(s);
    });
  }
  window.__xlsxReady = (async () => {
    const CDNS = [
      'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
      'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
      'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js',
    ];
    for (const url of CDNS){
      try {
        await loadScriptOnce(url);
        if (typeof XLSX !== 'undefined') return true;
      } catch (e){ /* thử CDN tiếp theo */ }
    }
    return false;
  })();
</script>
<script src="calc.js"></script>
<script src="app.js"></script>
<script src="init.js"></script>
</body>
</html>
